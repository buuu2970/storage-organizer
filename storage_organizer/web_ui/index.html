<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="recsort-token" content="__RECSORT_TOKEN__">
<title>RecSort — 録画の整理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><span class="logo" aria-hidden="true">▶</span> RecSort</div>
    <nav id="nav" aria-label="メニュー"></nav>
    <div class="side-note">録画は外部へ送信しません。<br>移動するのは最終確認で承認したものだけです。</div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<footer id="statusbar" role="status" aria-live="polite"></footer>
<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
